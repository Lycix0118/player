# 项目级 Gradle 配置（全局配置在 D:\gradle-home\gradle.properties）

# ⚠️ C 盘只剩 ~950MB：把 JVM 临时目录也挪到 D 盘，避免编译期写爆系统盘
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8 -Djava.io.tmpdir=D:/gradle-build/tmp
kotlin.daemon.jvmargs=-Xmx1792m -Dfile.encoding=UTF-8 -Djava.io.tmpdir=D:/gradle-build/tmp

org.gradle.caching=true
org.gradle.parallel=true
# 构建产物已重定向到 D 盘（见 settings.gradle.kts），此处关掉配置缓存以减少变量
org.gradle.configuration-cache=false

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
