<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FF6B6B">
    <meta name="description" content="专为儿童设计的B站视频播放应用，安全、简单、有趣">
    <meta name="keywords" content="儿童视频,B站下载,视频播放器,儿童应用">
    <meta name="author" content="儿童视频播放器">
    <!-- 确保安卓浏览器正确处理中文字符 -->
    <meta http-equiv="Content-Language" content="zh-CN">
    <meta name="format-detection" content="telephone=no">
    <meta name="x5-orientation" content="portrait">
    <meta name="x5-fullscreen" content="true">
    <meta name="x5-page-mode" content="app">

    <!-- PWA相关 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="儿童视频播放器">

    <!-- 预加载关键资源 -->
    <link rel="preload" href="styles.css?v=20261002-cute" as="style">
    <link rel="preload" href="app.js?v=20261002-cute" as="script">

    <title>🎬 儿童视频播放器</title>
    <!-- Plyr CSS (Local for LAN/Offline) -->
    <link rel="stylesheet" href="vendor/plyr.css" />
    <link rel="stylesheet" href="styles.css?v=20261002-cute">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192x192.png">
    <link rel="apple-touch-icon" href="icon-192x192.png">
</head>
<body>
    <!-- 加载页面 (萌趣微动效) -->
    <div id="loading" class="screen">
        <div class="loading-fun-box">
            <!-- 萌趣小电视 -->
            <div class="tv-wrapper">
                <!-- 顶部天线 -->
                <div class="tv-antenna">
                    <div class="antenna-stick antenna-left"></div>
                    <div class="antenna-stick antenna-right"></div>
                </div>
                <!-- 电视机主体 -->
                <div class="tv-body">
                    <!-- 屏幕区域 -->
                    <div class="tv-screen">
                        <div class="screen-glare"></div>
                        <!-- 灵动眨眼与表情 -->
                        <div class="tv-face">
                            <div class="tv-eye eye-left">
                                <span class="eye-shine"></span>
                            </div>
                            <div class="tv-eye eye-right">
                                <span class="eye-shine"></span>
                            </div>
                            <div class="tv-blush blush-left"></div>
                            <div class="tv-blush blush-right"></div>
                            <div class="tv-mouth"></div>
                        </div>
                    </div>
                    <!-- 旋钮与扬声器 -->
                    <div class="tv-side">
                        <div class="tv-knob knob-top"></div>
                        <div class="tv-knob knob-bottom"></div>
                        <div class="tv-speaker">
                            <span class="speaker-line"></span>
                            <span class="speaker-line"></span>
                            <span class="speaker-line"></span>
                        </div>
                    </div>
                </div>
                <!-- 底座支脚 -->
                <div class="tv-legs">
                    <div class="leg leg-left"></div>
                    <div class="leg leg-right"></div>
                </div>
                <!-- 呼吸投影 -->
                <div class="tv-shadow"></div>
            </div>

            <!-- 加载提示与三色弹跳糖果球 -->
            <div class="loading-status">
                <span class="loading-title">正在准备精彩视频</span>
                <div class="loading-dots">
                    <span class="dot dot-1"></span>
                    <span class="dot dot-2"></span>
                    <span class="dot dot-3"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- 文件夹列表页面 -->
    <div id="folders-screen" class="screen hidden">
        <header class="app-header">
            <button id="back-to-parent" class="back-btn hidden">← 返回</button>
            <h1 id="folders-title">📁 选择文件夹</h1>
            <button id="install-app" class="install-btn" type="button" title="添加到桌面" aria-label="添加到桌面">➕ 添加到桌面</button>
            <button id="open-settings" class="icon-btn" type="button" title="打开设置" aria-label="打开设置">⚙️</button>
        </header>
        <main class="content">
            <!-- 面包屑导航 -->
            <nav id="breadcrumb" class="breadcrumb hidden">
                <div class="breadcrumb-items">
                    <!-- 面包屑项目将动态加载 -->
                </div>
            </nav>
            <div id="folders-list" class="folders-grid">
                <!-- 文件夹将动态加载 -->
            </div>
        </main>
    </div>

    <!-- 设置页面 -->
    <div id="settings-screen" class="screen hidden">
        <header class="app-header">
            <button id="back-from-settings" class="back-btn" type="button">← 返回</button>
            <h1>⚙️ 设置</h1>
            <span class="header-spacer" aria-hidden="true"></span>
        </header>
        <main class="content settings-content">
            <section class="settings-section">
                <div class="settings-section-heading"><h2>账号与连接</h2><span class="settings-section-hint">用于解锁高清画质和字幕</span></div>
                <div class="settings-card">
                    <label class="settings-label" for="bilibili-cookie">B站 Cookie</label>
                    <p class="settings-description">粘贴浏览器中 bilibili.com 的完整 Cookie。Cookie 仅用于本播放器访问 B站接口。</p>
                    <div class="cookie-input-row"><textarea id="bilibili-cookie" class="cookie-input" rows="4" placeholder="SESSDATA=...; bili_jct=...;"></textarea><button id="toggle-cookie-visibility" class="secondary-btn" type="button">显示</button></div>
                    <div class="settings-action-row"><span id="cookie-status" class="settings-status">尚未配置</span><button id="save-cookie" class="primary-btn" type="button">保存 Cookie</button></div>
                </div>
            </section>
            <section class="settings-section">
                <div class="settings-section-heading"><h2>播放体验</h2><span class="settings-section-hint">下次打开时自动生效</span></div>
                <div class="settings-card settings-list">
                    <label class="setting-row"><span><strong>自动播放</strong><small>进入视频页面后自动开始播放</small></span><input id="setting-autoplay" class="switch-input" type="checkbox"></label>
                    <label class="setting-row"><span><strong>默认开启字幕</strong><small>视频有字幕时自动显示</small></span><input id="setting-subtitles" class="switch-input" type="checkbox" checked></label>
                </div>
            </section>
            <section class="settings-section">
                <div class="settings-section-heading"><h2>外观</h2><span class="settings-section-hint">更多主题后续加入</span></div>
                <div class="settings-card"><label class="settings-label" for="theme-select">配色主题</label><select id="theme-select" class="settings-select"><option value="candy">糖果电视（当前）</option></select></div>
            </section>
            <section class="settings-section">
                <div class="settings-section-heading"><h2>缓存与应用</h2><span id="cache-status" class="settings-section-hint">正在读取缓存状态…</span></div>
                <div class="settings-card settings-list">
                    <div class="setting-row setting-row-action"><span><strong>清理视频缓存</strong><small>不会删除 videos 文件夹中的原始视频</small></span><button id="clear-cache" class="secondary-btn" type="button">清理缓存</button></div>
                    <div class="setting-row setting-row-action"><span><strong>关于播放器</strong><small>儿童视频播放器 · 简单、安全、好用</small></span><span class="app-version">v1.0</span></div>
                </div>
            </section>
        </main>
    </div>

    <!-- 视频列表页面 -->
    <div id="videos-screen" class="screen hidden">
        <header class="app-header">
            <button id="back-to-folders" class="back-btn">← 返回</button>
            <h1 id="folder-title">📺 视频列表</h1>
        </header>
        <main class="content">
            <div id="videos-list" class="videos-grid">
                <!-- 视频列表将动态加载 -->
            </div>
        </main>
    </div>

    <!-- 视频播放页面 -->
    <div id="player-screen" class="screen hidden player-screen-cinema">
        <header class="player-header">
            <button id="back-to-videos" class="player-back-btn" title="返回列表">
                <span class="back-arrow">‹</span>
                <span class="back-text">返回</span>
            </button>
            <div class="player-title-box">
                <span id="player-badge" class="player-badge">第 1 集</span>
                <h1 id="video-title" class="player-video-title">正在准备播放...</h1>
            </div>
            <div class="player-header-spacer"></div>
        </header>
        <main class="player-main">
            <div id="video-container" class="video-container">
                <video id="video-player" playsinline preload="auto">
                    <track id="subtitle-track" kind="subtitles" src="" srclang="zh" label="中文字幕" default style="display: none;">
                    您的浏览器不支持视频播放。
                </video>
                <!-- 专业流媒体加载与准备遮罩层 -->
                <div id="download-progress" class="player-loader-overlay hidden">
                    <div class="loader-card">
                        <div class="loader-spinner"></div>
                        <div class="loader-info">
                            <span class="loader-title">正在连接高清视频流...</span>
                            <span id="progress-text" class="loader-percent">0%</span>
                        </div>
                        <div class="loader-bar">
                            <div id="progress-fill" class="loader-bar-fill"></div>
                        </div>
                        <span class="loader-hint">已优化 HTTP 206 极速分段加载与 Seek 支持</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 错误提示 -->
    <div id="error-toast" class="toast hidden">
        <span id="error-message"></span>
    </div>

    <!-- Plyr JavaScript (Local for LAN/Offline) -->
    <script src="vendor/plyr.js"></script>
    <script src="app.js?v=20261002-cute"></script>
</body>
</html>
